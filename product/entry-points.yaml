# Roots for accidental volume, plus every live authority in axes.yaml.

entry_points:
  - id: tui
    symbol: chat.__main__:main
    path: src/chat/__main__.py
    kind: program_start
  - id: chat-port
    symbol: chat.port
    path: src/chat/port.py
    kind: public_api
    note: Declared now so a second in-process UI is an add, not resurrection of dead API.
